[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-headroom"
version = "1.0.0"
description = "Headroom probe for multi-step financial reasoning over SEC filings, plus a Gymnasium env prototype."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.7.0",
    "openai==3.16.2",
    "matplotlib==3.11.2",
    "python-dotenv==1.2.3",
    "gymnasium==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fh-run = "finance_headroom.runner:main"
fh-score = "finance_headroom.scoring:main"
fh-analyze = "finance_headroom.analysis:main"
fh-replay = "finance_headroom.env.replay:main"
fh-demo = "finance_headroom.env.demo:main"
fh-judge = "finance_headroom.judge:main"
fh-gym = "finance_headroom.env.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
